{% extends "base.html" %}
{% block title %}Accesso{% endblock %}
{% block body %}
<div class="login card">
  <div class="brand big"><span class="dot"></span>US VIRAL <span class="muted">control</span></div>
  {% if problems %}
    <div class="banner warn"><b>Configurazione incompleta</b><ul>{% for p in problems %}<li>{{ p }}</li>{% endfor %}</ul></div>
  {% endif %}
  {% if error %}<div class="banner err">{{ error }}</div>{% endif %}
  <form method="post" action="/login" autocomplete="on">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    {% if totp %}
    <label for="code">Codice Authenticator</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required>
    {% endif %}
    <button class="primary wide">Entra</button>
  </form>
</div>
{% endblock %}
