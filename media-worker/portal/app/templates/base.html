<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{% block title %}US VIRAL{% endblock %} · Control</title>
<link rel="stylesheet" href="/static/style.css?v=1">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<script src="/static/app.js?v=1" defer></script>
</head>
<body>
{% if nav != "login.html" %}
<header class="top">
  <a class="brand" href="/"><span class="dot"></span>US VIRAL <span class="muted">control</span></a>
  <nav>
    <a href="/" class="{{ 'on' if nav == 'today.html' }}">Oggi</a>
    <a href="/coda" class="{{ 'on' if nav == 'queue.html' }}">Coda</a>
    <span class="soon" title="Fase 2">Contenuti</span>
    <span class="soon" title="Fase 2">Factory</span>
    <span class="soon" title="Fase 3">Analytics</span>
    <span class="soon" title="Fase 4">Impostazioni</span>
  </nav>
  <div class="actions">
    <span class="muted small" data-updated>aggiornato ora</span>
    <form method="post" action="/refresh"><button class="ghost" title="Rileggi subito i dati da n8n">↻</button></form>
    <form method="post" action="/logout"><button class="ghost">Esci</button></form>
  </div>
</header>
{% endif %}
<main>
{% if errors %}
  <div class="banner err">
    <b>Alcuni dati non sono disponibili.</b>
    <ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
  </div>
{% endif %}
{% block body %}{% endblock %}
</main>
</body>
</html>
