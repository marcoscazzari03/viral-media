# US VIRAL media worker: FastAPI job API (FFmpeg + faster-whisper + Piper TTS) behind Caddy (automatic HTTPS),
# plus the private control panel (portal) on its own subdomain.
services:
  worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_BASE_URL: https://${DOMAIN}
      DATA_DIR: /srv/media
    volumes:
      - media_data:/srv/media
    expose:
      - "8000"

  # Private control panel (dashboard): https://PORTAL_DOMAIN, login + 2FA. Reads n8n through its REST API.
  portal:
    build: ./portal
    restart: unless-stopped
    env_file: .env
    environment:
      WORKER_URL: http://worker:8000
      PUBLIC_MEDIA_URL: https://${DOMAIN}
      DATA_DIR: /srv/media
    volumes:
      - media_data:/srv/media:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - worker
      - portal
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-dashboard.weborastudio.it}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  media_data:
  caddy_data:
  caddy_config:
